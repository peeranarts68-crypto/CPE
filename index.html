<!DOCTYPE html>

<head>

  <meta name="description" content="ระบบสั่งจองเสื้อโปโลและเสื้อคลุมสาขาวิศวกรรมคอมพิวเตอร์ คณะวิศวกรรมศาสตร์และเทคโนโลยีอุตสาหกรรม มหาวิทยาลัยราชภัฏพิบูลสงคราม (PSRU) ขับเคลื่อนด้วย React & Firebase Cloud Database">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- Google Fonts (Kanit & Chakra Petch) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,500;0,700;1,700&family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- React 18 & ReactDOM 18 UMD CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

  <!-- REACT ROOT CONTAINER -->
  <div id="root"></div>

  <!-- FIREBASE INITIALIZER SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, doc, getDoc, getDocs, setDoc, deleteDoc, query, where, onSnapshot, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDPch8_YKWsu9g8UhloMeSKwWbkSWhj-QQ",
      authDomain: "cpeshirt.firebaseapp.com",
      projectId: "cpeshirt",
      storageBucket: "cpeshirt.firebasestorage.app",
      messagingSenderId: "998516352986",
      appId: "1:998516352986:web:69e2cc6ff55ca40b7782e3",
      measurementId: "G-B7TB1LSMSZ"
    };

    try {
      const app = initializeApp(firebaseConfig);
      let analytics = null;
      try { analytics = getAnalytics(app); } catch (e) {}
      const auth = getAuth(app);
      const db = getFirestore(app);

      window.CPEFirebase = {
        app, auth, db, analytics,
        signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged,
        collection, addDoc, doc, getDoc, getDocs, setDoc, deleteDoc, query, where, onSnapshot, orderBy, serverTimestamp
      };
    } catch (e) {
      console.log("Firebase setup warning:", e);
    }
    
    window.dispatchEvent(new Event('cpe-firebase-ready'));
  </script>

  <!-- REACT APPLICATION SCRIPT -->
  <script type="text/babel" src="js/app.jsx?v=20260808_v21_custom_file_upload_deposit_summary"></script>
</body>
</html>
